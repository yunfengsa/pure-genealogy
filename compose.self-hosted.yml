services:
  app:
    image: ${GENEALOGY_IMAGE:-onehacker/pure-genealogy:latest}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # 留空即同源部署：浏览器直接请求当前域名下的 /auth/v1 与 /rest/v1。
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?请先生成 .env.self-hosted}
      NEXT_PUBLIC_FAMILY_SURNAME: ${NEXT_PUBLIC_FAMILY_SURNAME:-刘}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://gateway:8000}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先生成 .env.self-hosted}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?请先生成 .env.self-hosted}
      REST_DB_PASSWORD: ${REST_DB_PASSWORD:?请先生成 .env.self-hosted}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/self-hosted/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./docker/self-hosted/roles.sql:/opt/genealogy/roles.sql:ro
      - ./docker/self-hosted/family-members.sql:/opt/genealogy/family-members.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.196.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      # 同源部署时公开 API 地址就是站点地址。
      API_EXTERNAL_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${SITE_URL}}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:?请配置应用的公开地址}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/auth/confirm,${SITE_URL}/auth/update-password
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?请先生成 .env.self-hosted}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-族谱}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${MAILER_TEMPLATES_RECOVERY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v14.17
    environment:
      PGRST_DB_URI: postgres://authenticator:${REST_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?请先生成 .env.self-hosted}
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_DB_MAX_ROWS: "10000"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    environment:
      ANON_KEY: ${ANON_KEY:?请先生成 .env.self-hosted}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?请先生成 .env.self-hosted}
      SITE_URL: ${SITE_URL:?请配置应用的公开地址}
      NGINX_ENVSUBST_FILTER: '^(ANON_KEY|SERVICE_ROLE_KEY|SITE_URL)$'
    volumes:
      - ./docker/self-hosted/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
