services:
  app:
    image: ${GENEALOGY_IMAGE:-onehacker/pure-genealogy:latest}
    build:
      context: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # 留空即同源部署：浏览器直接请求当前域名下的 /auth/v1 与 /rest/v1。
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?请配置 publishable 或 anon key}
      NEXT_PUBLIC_FAMILY_SURNAME: ${NEXT_PUBLIC_FAMILY_SURNAME:-刘}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
    restart: unless-stopped
